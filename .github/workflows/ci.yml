name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 20 is the oldest Node the CLI supports; 24 is what the Action runs on.
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # The Action runs the committed dist/, so a stale bundle ships stale code.
  bundle-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: dist/ matches the source
        run: git diff --exit-code -- dist/ || { echo "::error::dist/ is stale — run 'npm run bundle' and commit it"; exit 1; }

  # Runs the Action the way a customer does. No token is available here, so it
  # proves the bundle loads, reads inputs and fails cleanly rather than crashing.
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: run
        uses: ./
        continue-on-error: true
        with:
          plan-id: '827'
          token: ''
      - name: Failed with a configuration error, not a crash
        run: test "${{ steps.run.outcome }}" = failure

  # The image every non-GitHub wrapper runs. Built, never pushed, on PRs.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t contextqa-cli:ci .
      - name: Reports its version
        run: docker run --rm contextqa-cli:ci --version
      - name: Exits 2 without a token, reading options from the environment
        run: |
          set +e
          docker run --rm -e CONTEXTQA_PLAN_ID=827 contextqa-cli:ci
          test $? -eq 2

  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GitLab component renders to a valid job
        run: python3 scripts/check-gitlab-component.py
      - name: CircleCI orb is valid
        run: docker run --rm -v "$PWD/providers/circleci:/orb" -w /orb circleci/circleci-cli:1.6.0 circleci orb validate orb.yml
